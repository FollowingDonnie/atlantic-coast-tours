services:
  - type: web
    name: atlantic-coast-tours
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: ALLOWED_ORIGINS
        value: https://followingdonnie.github.io
      - key: OPENAI_API_KEY
        sync: false
